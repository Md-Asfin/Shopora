# ===================================================================
# Shopora E-Commerce - Main Application Properties
# ===================================================================

spring.application.name=shopora-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Configuration (Supports Railway dynamic PORT)
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=

# Database Configuration (MySQL - Supports DB_URL, Railway MySQLHOST/PORT/DATABASE, and local fallback)
spring.datasource.url=${DB_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ecom_db}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security & JWT Configuration
shopora.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
shopora.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Admin Seed Configuration (Development Initializer)
shopora.admin.email=${ADMIN_EMAIL:admin@shopora.com}
shopora.admin.password=${ADMIN_PASSWORD:Admin@Shopora123}
shopora.admin.name=${ADMIN_NAME:Shopora Administrator}

# CORS Configuration
shopora.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://shopora-six-delta.vercel.app}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
